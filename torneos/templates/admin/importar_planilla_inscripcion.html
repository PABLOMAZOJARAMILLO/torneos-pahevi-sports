{% extends "admin/base_site.html" %}

{% block content %}

<h1>Importar planilla</h1>

<form method="post" enctype="multipart/form-data">

    {% csrf_token %}

    <input type="file"
           name="archivo_excel"
           accept=".xlsx">

    <br><br>

    <button type="submit">
        Importar
    </button>

</form>

{% endblock %}
