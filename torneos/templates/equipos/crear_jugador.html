<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agregar jugador</title>
</head>
<body>

<h1>Agregar jugador a {{ equipo.nombre }}</h1>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <input type="text" name="nombres" placeholder="Nombre" required>
    <br><br>

    <input type="text" name="cedula" placeholder="Cédula">
    <br><br>

    <input type="number" name="dorsal" placeholder="Dorsal">
    <br><br>
    
    <input type="date" name="fecha_nacimiento" required>
    <br><br>

    <input type="file" name="foto">
    <br><br>

    <button type="submit">
        Guardar jugador
    </button>
</form>

</body>
</html>
