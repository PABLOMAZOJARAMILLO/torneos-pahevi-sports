<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partido en vivo</title>
</head>

<body>

<h1>🔴 EN VIVO</h1>

{% if partido.inicio_en_vivo %}

<h2 class="live-clock"
    data-inicio="{{ partido.inicio_en_vivo|date:'c' }}">
    ⏱ 0'
</h2>

{% endif %}

<h2>
    {{ partido.equipo_local.nombre }}
    {{ partido.goles_local }} - {{ partido.goles_visitante }}
    {{ partido.equipo_visitante.nombre }}
</h2>

<p>
    {{ partido.fecha }} · {{ partido.hora }} · {{ partido.cancha }}
</p>

<a href="{% url 'panel' %}">Volver al panel</a>

<script>
function actualizarRelojLive() {
    const reloj = document.getElementById("reloj-live");
    if (!reloj) return;

    const fecha = reloj.dataset.fecha;
    const hora = reloj.dataset.hora;

    if (!fecha || !hora) {
        reloj.innerHTML = "⏱ Sin hora";
        return;
    }

    const inicio = new Date(fecha + "T" + hora + ":00-05:00");
    const ahora = new Date();

    let minutos = Math.floor((ahora - inicio) / 60000);

    if (minutos < 0) minutos = 0;

    reloj.innerHTML = "⏱ " + minutos + "'";
}

actualizarRelojLive();
setInterval(actualizarRelojLive, 30000);
</script>

</body>
</html>
