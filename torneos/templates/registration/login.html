<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 18px;
            background: radial-gradient(circle at top, #12345a, #07111f);
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-weight: 800;
        }
        .login-card {
            width: min(100%, 420px);
            background: #101d30;
            border: 1px solid rgba(0, 255, 102, 0.35);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 20px 44px rgba(0, 0, 0, 0.35);
        }
        h1 {
            margin: 0 0 8px;
            color: #00ff66;
            font-size: clamp(30px, 8vw, 44px);
            text-transform: uppercase;
            text-align: center;
        }
        .sub {
            margin: 0 0 20px;
            color: #cbd5e1;
            text-align: center;
            font-size: 14px;
        }
        label {
            display: block;
            margin: 14px 0 6px;
            color: #bbf7d0;
        }
        input {
            width: 100%;
            min-height: 48px;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 11px 12px;
            background: #f8fafc;
            color: #07111f;
            font: inherit;
        }
        .errorlist, .error {
            margin: 0 0 14px;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(239, 68, 68, 0.18);
            color: #fecaca;
            list-style: none;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            min-height: 48px;
            margin-top: 18px;
            border: 0;
            border-radius: 999px;
            background: #00e565;
            color: #03110a;
            font: inherit;
            font-weight: 900;
            cursor: pointer;
        }
        .volver {
            display: flex;
            justify-content: center;
            margin-top: 16px;
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>Ingresar</h1>
        <p class="sub">Acceso para administradores y planilleros autorizados.</p>

        {% if form.non_field_errors %}
            <div class="error">{{ form.non_field_errors }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <label for="{{ form.username.id_for_label }}">Usuario</label>
            {{ form.username }}

            <label for="{{ form.password.id_for_label }}">Contraseña</label>
            {{ form.password }}

            <button class="btn" type="submit">Entrar</button>
        </form>

        <a class="volver" href="{% url 'panel' %}">Volver al panel</a>
    </main>
</body>
</html>
