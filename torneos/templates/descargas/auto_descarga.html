<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Descargando imagen...</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
body {
    margin: 0;
    padding: 0;
    background: #020617;
}

.zona-descarga {
    width: fit-content;
    margin: 0 auto;
}

.mensaje {
    position: fixed;
    top: 15px;
    left: 15px;
    background: #00ff66;
    color: black;
    padding: 12px 20px;
    border-radius: 12px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    z-index: 9999;
}

.volver {
    position: fixed;
    right: 15px;
    top: 15px;
    border: 0;
    border-radius: 999px;
    padding: 12px 18px;
    background: #ffffff;
    color: #061224;
    font-family: Arial, sans-serif;
    font-weight: bold;
    z-index: 9999;
    box-shadow: 0 8px 22px rgba(0,0,0,0.22);
}
</style>
</head>

<body>

<div class="mensaje">
    Generando imagen, espera unos segundos...
</div>

<button class="volver" type="button" onclick="volverDespuesDescarga()">Volver</button>

{% if paginas %}
{% for pagina in paginas %}
<div class="zona-descarga" data-nombre-archivo="{{ pagina.nombre_archivo }}">
    {{ pagina.contenido_html|safe }}
</div>
{% endfor %}
{% else %}
<div class="zona-descarga" data-nombre-archivo="{{ nombre_archivo }}">
    {{ contenido_html|safe }}
</div>
{% endif %}

<script>
function volverDespuesDescarga() {
    const volverUrl = "{{ volver_url|escapejs }}";
    window.location.href = volverUrl || "/";
}

function volverAutomaticamente() {
    setTimeout(volverDespuesDescarga, 2500);
}

window.onload = function() {
    const elementos = Array.from(document.querySelectorAll(".zona-descarga"));

    function guardarCanvas(canvas, nombreArchivo) {
        const dataUrl = canvas.toDataURL("image/png");
        if (window.AndroidDownloader) {
            if (typeof window.AndroidDownloader.guardarImagen === "function") {
                window.AndroidDownloader.guardarImagen(dataUrl, nombreArchivo);
            } else if (typeof window.AndroidDownloader.postMessage === "function") {
                window.AndroidDownloader.postMessage(JSON.stringify({
                    dataUrl: dataUrl,
                    nombreArchivo: nombreArchivo
                }));
            } else {
                throw new Error("La APK no pudo recibir la imagen");
            }
            return;
        }
        const enlace = document.createElement("a");
        enlace.download = nombreArchivo;
        enlace.href = dataUrl;
        enlace.click();
    }

    async function generarPaginas() {
        for (let indice = 0; indice < elementos.length; indice += 1) {
            const elemento = elementos[indice];
            document.querySelector(".mensaje").innerText =
                "Generando imagen " + (indice + 1) + " de " + elementos.length + "...";
            const canvas = await html2canvas(elemento, {
                scale: 2,
                useCORS: true,
                backgroundColor: "#020617",
                width: elemento.scrollWidth,
                height: elemento.scrollHeight,
                windowWidth: elemento.scrollWidth,
                windowHeight: elemento.scrollHeight
            });
            guardarCanvas(canvas, elemento.dataset.nombreArchivo);
            await new Promise(function(resolve) { setTimeout(resolve, 350); });
        }
        document.querySelector(".mensaje").innerText =
            elementos.length > 1 ? "Imágenes generadas. Volviendo..." : "Imagen generada. Volviendo...";
        volverAutomaticamente();
    }

    setTimeout(function() {
        generarPaginas().catch(function(error) {
            document.querySelector(".mensaje").innerText = error.message || "No se pudieron generar las imágenes";
        });
    }, 1000);
}
</script>

</body>
</html>
