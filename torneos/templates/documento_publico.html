{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ documento.titulo }} | Torneos IMCRED</title>
    <style>
        :root {
            --fondo: #06111f;
            --panel: #edf3f8;
            --azul: #0c2440;
            --verde: #00e66f;
            --texto: #06142b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--fondo);
            color: var(--texto);
            font-family: Arial, Helvetica, sans-serif;
        }

        .documento-header {
            position: sticky;
            top: 0;
            z-index: 5;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: var(--azul);
            border-bottom: 3px solid var(--verde);
            color: #fff;
        }

        .documento-header h1 {
            margin: 0;
            font-size: clamp(1rem, 3vw, 1.35rem);
            line-height: 1.15;
        }

        .acciones {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 9px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,.25);
            background: var(--verde);
            color: #001b12;
            text-decoration: none;
            font-weight: 800;
            white-space: nowrap;
        }

        .btn.secundario {
            background: #fff;
            color: var(--azul);
        }

        .visor-wrap {
            height: calc(100vh - 69px);
            padding: 12px;
            background: var(--panel);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 8px;
            background: #fff;
        }

        .ayuda {
            display: none;
            margin: 12px auto;
            max-width: 620px;
            padding: 16px;
            border-radius: 10px;
            background: #fff;
            font-weight: 700;
            line-height: 1.4;
        }

        @media (max-width: 640px) {
            .documento-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .acciones {
                width: 100%;
                justify-content: flex-start;
            }

            .visor-wrap {
                height: calc(100vh - 126px);
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <header class="documento-header">
        <h1>{{ documento.get_tipo_display }} - {{ documento.titulo }}</h1>
        <div class="acciones">
            <a class="btn secundario" href="{{ request.META.HTTP_REFERER|default:'/' }}">Volver</a>
            <a class="btn" href="{{ archivo_url }}" target="_blank" rel="noopener">Abrir documento</a>
        </div>
    </header>

    <main class="visor-wrap">
        <iframe src="{{ visor_url }}" title="{{ documento.titulo }}"></iframe>
        <div class="ayuda">
            Si el documento no carga, toca el botón Abrir documento.
        </div>
    </main>
</body>
</html>
