{% extends "contabilidad/base.html" %}{% block heading %}{{ titulo }}{% endblock %}{% block content %}<section class="panel"><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button class="primary">Guardar</button><a class="secondary" href="{% url 'contabilidad:inicio' %}">Cancelar</a></form></section>{% if form.partidos %}<script>document.addEventListener("DOMContentLoaded",function(){const concepto=document.getElementById("id_concepto"),partidos=document.getElementById("id_partidos"),contenedor=partidos&&partidos.closest("p");if(!concepto||!contenedor)return;function actualizar(){contenedor.hidden=concepto.value!=="Pago de árbitros";}concepto.addEventListener("change",actualizar);actualizar();});</script>{% endif %}{% endblock %}
