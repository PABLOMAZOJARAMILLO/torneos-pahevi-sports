{% load static %}<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12372a"><meta name="application-name" content="Contabilidad de Torneos"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Contabilidad"><title>{% block title %}Cuentas del Torneo{% endblock %}</title><link rel="manifest" href="/static/contabilidad/manifest.json"><link rel="apple-touch-icon" href="/static/contabilidad/icono-contable.png"><link rel="icon" type="image/png" href="/static/contabilidad/icono-contable.png"><link rel="stylesheet" href="{% static 'contabilidad/styles.css' %}"></head>
<body><header class="topbar"><div><p class="eyebrow">CONTROL CONTABLE</p><h1>{% block heading %}Cuentas del Torneo{% endblock %}</h1></div><a class="icon-button" href="{% url 'panel' %}" aria-label="Volver a la app de fútbol">⚽</a></header>
